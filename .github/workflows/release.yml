name: Release

# The only way to cut a release. Everything a release needs — a green check, a
# changelog section, the commit, the tag, the archives — happens here, in an
# order that cannot be got wrong, so that the version number is the only thing
# left to get right.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v — for example 0.1.0'
        required: true
        type: string

# Two releases at once would race for main and for the tag.
concurrency:
  group: release

permissions:
  # The job pushes the release commit and the tag, and goreleaser creates the
  # GitHub release and uploads the archives to it.
  contents: write

env:
  # The input reaches the steps through the environment and never through
  # `${{ }}` inside a run body, where it would be pasted into the shell line.
  VERSION: ${{ inputs.version }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The dispatch dialog offers every branch, and pushing another one's
      # content to main would be silent.
      - name: Refuse to release from a branch other than main
        if: github.ref_name != 'main'
        run: |
          echo 'A release is cut from main.' >&2
          exit 1

      - uses: actions/checkout@v6
        with:
          # goreleaser derives the version from the full history and the tags,
          # which a shallow clone does not carry.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          install-mode: binary
          install-only: true

      # Nothing else verifies the commit that is about to be tagged. Running it
      # first also means a red check leaves the repository untouched.
      - run: make check

      - name: Turn the unreleased section into a released one
        run: go run tools/release-section.go "$VERSION"

      # Read the section back from the rewritten changelog and print it: a
      # rewrite that left no usable section fails here, before the tag exists,
      # rather than halfway through publishing. The file is written outside the
      # repository, where goreleaser does not count it as a change to the tree.
      - name: Extract the release notes
        run: |
          go run tools/release-notes.go "$VERSION" CHANGELOG.md "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      # Build every binary once before anything is pushed, so that the license
      # check below runs while a failure still leaves the repository untouched.
      # The third-party licenses are generated by a build hook, and nothing
      # else would notice a hook that left a binary without them. A snapshot
      # publishes nothing; the release below builds the same commit with the
      # same pinned go-licenses from the same immutable modules.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: build --snapshot --clean

      # spf13/cobra is linked on every platform, so a set without it is a set
      # the hook failed to generate. The linux/amd64 binary is the one this
      # runner can execute; the others embed their sets the same way.
      - name: Check the embedded licenses
        run: |
          for dir in internal/licenses/embed/*/; do
            if [ ! -d "${dir}third-party/github.com/spf13/cobra" ]; then
              echo "no third-party licenses generated in $dir" >&2
              exit 1
            fi
          done
          dist/tfscli_linux_amd64*/tfscli licenses | grep -qx '  github.com/spf13/cobra'

      # A push made with GITHUB_TOKEN does not start another workflow, so the
      # release commit will not set off a redundant CI run.
      - name: Commit, tag, and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Release $VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main
          git push origin "v$VERSION"

      # --release-notes is the whole body above the footer from .goreleaser.yaml:
      # it turns off goreleaser's own changelog generated from the commit log.
      # The release is created as a draft (draft: true in .goreleaser.yaml).
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
