version: 2

project_name: tfscli

before:
  hooks:
    # go-licenses generates the third-party licenses each binary embeds (see
    # the build pre-hook). It is installed for the platform goreleaser runs on:
    # `go run` in the pre-hook would build it for the target's GOOS instead,
    # and a binary for another platform cannot be executed.
    - go install github.com/google/go-licenses/v2@v2.0.1

builds:
  - id: tfscli
    main: ./cmd/tfscli
    binary: tfscli
    # The dependencies are pure Go and cross-compilation needs no C toolchain;
    # pinning this keeps the build independent of the runner environment.
    env:
      - CGO_ENABLED=0
    ldflags:
      - -X main.version={{ .Version }} -X main.commit={{ .Commit }}
    # The licenses of the third-party modules linked into this target, saved
    # where internal/licenses embeds them for it. GOOS and GOARCH make
    # go-licenses follow the target's dependencies, which differ by platform.
    # The targets build in parallel, and each writes to a directory of its
    # own; --force replaces what an earlier build left there. A hook runs
    # without a shell, so nothing here may rely on one.
    hooks:
      pre:
        - cmd: go-licenses save ./cmd/tfscli --save_path=internal/licenses/embed/{{ .Os }}-{{ .Arch }}/third-party --ignore github.com/dpleshakov/tfscli --force
          env:
            - "GOOS={{ .Os }}"
            - "GOARCH={{ .Arch }}"
          output: true
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: tfscli
    name_template: "tfscli-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # The archive unpacks into a directory named like it, rather than
    # scattering its files into the directory it is unpacked in.
    wrap_in_directory: true
    # Only what a user needs beside the binary. The documentation lives on
    # GitHub, and the release page carries the changelog section; the
    # third-party licenses are embedded in the binary (tfscli licenses).
    files:
      - LICENSE
      # The agent skill ships with the binary so that an AI agent that unpacks
      # the archive can be told how to use tfscli without a second download.
      # The directory is kept whole: it is copied as-is into a skills path.
      - skills

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: dpleshakov
    name: tfscli
  name_template: "tfscli v{{ .Version }}"
  # Every release is reviewed and published by hand.
  draft: true
  # The last lines of every release page, below the changelog section the
  # release workflow passes as --release-notes. This is the config field, not
  # the --release-footer flag: the flag is ignored when --release-notes is
  # given, while the field is added to the body whatever the notes came from.
  footer: |
    ---

    Before the first run, store the server URL, the collection, and a personal access token with `tfscli auth login`, as described in [Authentication](https://github.com/dpleshakov/tfscli#authentication).
